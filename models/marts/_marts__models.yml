version: 2

models:
  - name: fct_transactions
    description: >
      The base fact. One row per transaction, enriched with account, currency
      and merchant category attributes. Partitioned by event_date, clustered
      on account_id and currency_code, and loaded with a static
      insert_overwrite over a 3 day window. Everything else in marts/ reads
      this.
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: amount
        description: NUMERIC, in currency_code. Never converted.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: currency_code
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
          - not_in_future:
              arguments:
                grace_days: 1
      - name: mcc_category_group
        description: >
          Coarse merchant category, or 'unmapped'. Live data carries
          'unmapped': the upstream producer emits a null mcc on some
          transactions, and labelling that is the point of the coalesce.
        tests:
          - not_null
      - name: channel
        description: >
          Lowercased upstream, where a null becomes 'unknown'. Warn and not
          error, because a new payment channel is a thing to go and read
          about rather than a reason to stop the load.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['card', 'sepa', 'swift', 'wallet', 'unknown']
              config:
                severity: warn
      - name: sample_bucket
        description: >
          Deterministic 0 to 99 bucket from farm_fingerprint(transaction_id).
          `where sample_bucket = 0` is a stable one percent across queries and
          across rebuilds.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 99
                inclusive: true
      - name: is_orphan_account
        description: >
          True when CRM has no account for this transaction. Expected to be
          false and tested at warn severity, because the normal cause is CRM
          running a few minutes behind and the pipeline must not stop for it.
        tests:
          - accepted_values:
              arguments:
                values: [false]
                quote: false
              config:
                severity: warn
      - name: is_unknown_currency
        description: >
          True when the currency is not in the seed. Warn and not error: the
          correct response is to add the currency to seeds/currencies.csv,
          not to fail the load and lose the day.
        tests:
          - accepted_values:
              arguments:
                values: [false]
                quote: false
              config:
                severity: warn

  - name: fct_account_currency_daily
    description: >
      Account day totals in one currency, against that account's own trailing
      baseline. Reads 31 days and writes 3.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['event_date', 'account_id', 'currency_code']
    columns:
      - name: event_date
        tests:
          - not_null
          - not_in_future:
              arguments:
                grace_days: 1
      - name: txn_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: active_days_trailing
        description: >
          Days with activity inside the trailing window, which is 28 days, so
          the value cannot exceed 28.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 28
                inclusive: true
      - name: category_hhi
        description: >
          Herfindahl index over the day's merchant category groups. 1.0 means
          a single category. Bounded above by 1 because the shares sum to 1.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: has_usable_baseline
        tests:
          - not_null

  - name: fct_category_daily
    description: >
      Merchant category group by currency by day, with each group's share of
      its own currency's day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['event_date', 'currency_code', 'mcc_category_group']
    columns:
      - name: event_date
        tests:
          - not_null
          - not_in_future:
              arguments:
                grace_days: 1
      - name: total_amount
        description: >
          Reconciled against the fact table rather than only range checked. A
          dropped join key leaves this aggregate internally consistent and
          short, and no uniqueness or range test can see a row that is not
          there.
        tests:
          - not_null
          - reconciles_with:
              arguments:
                parent_relation: ref('fct_transactions')
                parent_column: amount
                group_by_columns: ['event_date', 'currency_code']
      - name: share_of_currency_day_amount
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: active_accounts
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: fct_velocity_alerts
    description: >
      One row per transaction with at most one velocity alert. Flags are
      priority ordered and mutually exclusive, so they can be summed without
      double counting and a per-flag count is not a per-rule count.
    tests:
      - mutually_exclusive_flags:
          arguments:
            flags: ['is_rapid_fire', 'is_country_hop', 'is_round_amount', 'is_normal']
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_transactions')
                field: transaction_id
      - name: alert_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rapid_fire', 'country_hop', 'round_amount', 'none']
      - name: event_date
        tests:
          - not_null
          - not_in_future:
              arguments:
                grace_days: 1
      - name: is_alert
        tests:
          - not_null

  - name: dim_accounts
    description: >
      One row per account, CRM attributes plus lifetime activity. Rebuilt in
      full on every run. No snapshot, because the source has no change
      history to snapshot.
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: lifetime_txn_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: last_txn_date
        tests:
          - not_in_future
      - name: tenure_days
        description: >
          Days since the account was opened. Negative means CRM holds an
          opening date in the future, which is a CRM problem and is reported
          rather than enforced.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: warn
      - name: has_never_transacted
        tests:
          - not_null
