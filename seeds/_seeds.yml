version: 2

seeds:
  - name: currencies
    description: >
      ISO 4217 code, numeric code and minor unit count. The minor unit column
      is the one that matters: it is 0 for JPY and ISK, 2 for most of the
      table, and 3 for BHD, JOD, KWD and TND. A pipeline that assumes 2
      everywhere is wrong by a factor of 100 on four of these 31 rows and by
      a factor of 1000 on another four.
    config:
      column_types:
        iso_numeric: string
        minor_units: int64
    columns:
      - name: currency_code
        description: ISO 4217 alphabetic code, uppercase.
        tests:
          - unique
          - not_null
      - name: iso_numeric
        description: >
          ISO 4217 numeric code, stored as a string. Typed explicitly because
          AUD is 036 and BHD is 048, and an inferred integer column turns
          both into a number that no longer matches ISO 4217.
        tests:
          - unique
          - not_null
      - name: minor_units
        description: Decimal places the currency is denominated in.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 2, 3]
                quote: false

  - name: mcc_categories
    description: >
      Merchant category codes mapped to a readable category and a coarser
      group. Not exhaustive: the 38 rows cover the codes that appear in the
      silver layer today, and anything unmapped is labelled rather than
      dropped.
    columns:
      - name: mcc
        description: Four digit merchant category code.
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - not_null
      - name: category_group
        description: >
          Coarse grouping used by fct_category_daily. Adding a value here
          changes that mart's grain, so the accepted_values list is the
          contract.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - travel
                  - telecom
                  - utilities
                  - grocery
                  - fuel
                  - retail
                  - dining
                  - health
                  - cash
                  - financial
                  - services
                  - entertainment
                  - gambling
                  - education
                  - nonprofit
